<div class="clinic-grid">{% for branch in branches %}<article class="clinic-card {% if branch.id == selected_branch.id %}selected{% endif %}" data-branch-card="{{ branch.id }}"><div class="clinic-top"><span class="eyebrow">{{ branch.city }}</span><span class="selected-label">Your clinic</span></div><h3>{{ branch.name }}</h3><p>{{ branch.address }}</p><a class="clinic-phone" href="tel:{{ branch.tel }}">{{ branch.phone }}</a><div class="clinic-links"><a href="{% url 'branch' branch.id %}">Explore {{ branch.name }} <span>↗</span></a><a class="choose-branch" data-choose-branch="{{ branch.id }}" href="{% url 'home' %}?branch={{ branch.id }}#appointment">Select clinic &amp; see map ↗</a></div></article>{% endfor %}</div>
